# Integration stack: a dev-mode Keycloak and a dev-mode Vault that loads the
# plugin binary from ../dist/plugins. Dev mode auto-registers every binary in
# -dev-plugin-dir under its file name, so no `vault plugin register` is needed.
#
# Build the Linux binary first (task integration does this):
#   CGO_ENABLED=0 GOOS=linux go build -o dist/plugins/vault-plugin-keycloak-secrets ./cmd/vault-plugin-keycloak-secrets
#
# Image versions default to the newest pinned in the CI matrix; override with
# VAULT_VERSION / KEYCLOAK_VERSION.
#
# Vault reaches Keycloak by two names, resolved by the dns service exactly as
# production records are: keycloak.clustera.dev.bradfordwagner.com (A record)
# and keycloak.dev.bradfordwagner.com (CNAME to it), plus an admin-only name,
# keycloak-admin.clustera.dev.bradfordwagner.com. All three resolve to the
# ingress service, which serves them over TLS on 443 and plain HTTP on 8080.
# The test runs the engine once per name and scheme. hostname-fixed.yml pins KC_HOSTNAME and KC_HOSTNAME_ADMIN; without
# it Keycloak derives its hostname per request.
#
# The test process reaches Keycloak and Vault on 127.0.0.1 through host ports
# Docker picks at random, so nothing collides with services already bound
# locally. The test looks them up with `docker compose port` unless KEYCLOAK_URL /
# INTEGRATION_VAULT_ADDR are set (ambient VAULT_ADDR / VAULT_TOKEN are ignored).
name: vkp-integration

services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.2}
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1::8080"
    networks:
      default:
        ipv4_address: 172.30.53.10

  ingress:
    image: caddy:2.11.9
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1::443"
    networks:
      default:
        ipv4_address: 172.30.53.20
    depends_on:
      - keycloak

  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns:/etc/coredns:ro
    networks:
      default:
        ipv4_address: 172.30.53.53

  vault:
    image: hashicorp/vault:${VAULT_VERSION:-2.2.1}
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/vault/plugins
    cap_add: ["IPC_LOCK"]
    volumes:
      - ../dist/plugins:/vault/plugins:ro
    ports:
      - "127.0.0.1::8200"
    # Docker's embedded DNS still answers compose names and forwards the rest here.
    dns: [172.30.53.53]
    depends_on:
      - ingress
      - dns

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.53.0/24
