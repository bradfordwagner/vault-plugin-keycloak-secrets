# Overlay: pin Keycloak's hostname to the CNAME and put the admin console on
# its own name, as a hardened production deployment would. Without it Keycloak
# derives the hostname from each request.
services:
  keycloak:
    environment:
      KC_HOSTNAME: https://keycloak.dev.bradfordwagner.com
      KC_HOSTNAME_ADMIN: https://keycloak-admin.clustera.dev.bradfordwagner.com
