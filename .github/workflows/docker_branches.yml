name: docker-branches
# Validate the carrier image builds on both architectures for every branch push.
# Branch builds do NOT push (no manifest to stitch); the tag workflow publishes.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
env:
  image: ghcr.io/bradfordwagner/vault-plugin-keycloak-secrets
  # The owned Go builder used for the build stage. Pin to a real tag.
  builder_image: ghcr.io/bradfordwagner/go-builder:1.26-ubuntu_noble
jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: "build scratch ${{ matrix.platform.arch }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          build-args: |
            BUILDER_IMAGE=${{ env.builder_image }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.image }}:ci-scratch-${{ matrix.platform.arch }}
