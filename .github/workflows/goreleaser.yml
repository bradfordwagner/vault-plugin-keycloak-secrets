name: goreleaser
# GitHub-release delivery path: on a tag push, GoReleaser builds the per-OS/arch
# tar.gz archives + checksums and publishes them as release assets. The
# in-cluster plugin manager fetches these by URL (its `url:` source) and
# verifies the sha256 of the EXTRACTED binary. The OCI image (docker-tags.yml)
# is the parallel `image:` delivery path; both fire on the same tag.
on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can diff against the prior tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
