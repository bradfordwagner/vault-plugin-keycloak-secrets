name: docker-tags
# OCI delivery path: on a tag push, build the carrier image per-arch on native
# runners (no QEMU), push by digest, then stitch a multi-arch manifest list
# under the release tag. The plugin manager consumes this via its `image:`
# source (extracting the binary at /usr/local/bin/vault-plugin-keycloak-secrets).
# GoReleaser (goreleaser.yml) publishes the parallel tar.gz `url:` path.
on:
  push:
    tags:
      - '*'
env:
  image: ghcr.io/bradfordwagner/vault-plugin-keycloak-secrets
  # The owned Go builder used for the build stage. Pin to a real tag.
  builder_image: ghcr.io/bradfordwagner/go-builder:1.26-ubuntu_noble
jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: "build scratch ${{ matrix.platform.arch }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            BUILDER_IMAGE=${{ env.builder_image }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-scratch-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest list under the tag.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    name: "merge scratch"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-scratch-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.image }}:${{ github.ref_name }}-scratch \
            -t ${{ env.image }}:${{ github.ref_name }} \
            $(printf '${{ env.image }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.image }}:${{ github.ref_name }}
