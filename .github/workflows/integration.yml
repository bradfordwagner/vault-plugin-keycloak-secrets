name: integration
# End-to-end test against a real Keycloak and a real dev-mode Vault. The plugin
# is built for the runner's arch, loaded through Vault's -dev-plugin-dir, and
# driven through the client package: issue, renew, revoke, lease expiry and
# admin-secret rotation. Stack: integration/docker-compose.yml.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Last 3 minor releases of each, pinned to their newest patch. Renovate
    # keeps the window current via .github/renovate/version-matrix.mjs.
    strategy:
      fail-fast: false
      matrix:
        # renovate: datasource=docker depName=hashicorp/vault
        vault: ['2.2.0', '2.1.2', '2.0.4']
        # renovate: datasource=docker depName=quay.io/keycloak/keycloak
        keycloak: ['26.8.1', '26.7.5', '26.6.4']
    name: "vault ${{ matrix.vault }} / keycloak ${{ matrix.keycloak }}"
    env:
      VAULT_VERSION: ${{ matrix.vault }}
      KEYCLOAK_VERSION: ${{ matrix.keycloak }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/plugins/vault-plugin-keycloak-secrets ./cmd/vault-plugin-keycloak-secrets

      - name: Start Keycloak + Vault
        run: docker compose -f integration/docker-compose.yml up -d

      - name: Integration test
        run: go test -tags integration -count=1 -v ./integration/...

      - name: Container logs
        if: failure()
        run: docker compose -f integration/docker-compose.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f integration/docker-compose.yml down -v

  # Single stable check for branch protection. Matrix job names change whenever
  # a version is bumped, so main requires this job instead of each cell.
  integration-ok:
    runs-on: ubuntu-latest
    needs: integration
    if: always()
    name: integration ok
    steps:
      - name: All matrix jobs passed
        run: test "${{ needs.integration.result }}" = success
